  summary: The password for the new account, requiring complexity (uppercase, lowercase, number, and special character).
  example: []
  syntax:
    content: >-
      [Required(ErrorMessage = "Password is required")]

      [StringLength(128, MinimumLength = 8, ErrorMessage = "Password must be at least 8 characters long.")]

      [RegularExpression("^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[@$!%*?&]).+$", ErrorMessage = "Password must contain uppercase letter, lowercase letter, number, and special character.")]

      public string Password { get; set; }
