  namespace: Gadema.Core.Models.Writing.Characters
  summary: >-
    Represents the primary entity for a character within the narrative structure.

    Acts as an aggregator that links identity (via <xref href="Gadema.Core.Models.Writing.Characters.Character.ContentMetaInfo" data-throw-if-not-resolved="false"></xref>),

    static backstory (via <xref href="Gadema.Core.Models.Writing.Characters.CharacterStoryProfile" data-throw-if-not-resolved="false"></xref>), and dynamic story progression (via <xref href="Gadema.Core.Models.Writing.Characters.CharacterState" data-throw-if-not-resolved="false"></xref>).
