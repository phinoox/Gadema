  assemblies:
  - Gadema.Core
  namespace: Gadema.Core.Utils
  summary: Converts an enum member into a deterministic GUID using the <xref href="Gadema.Core.Utils.ModuleIndexAttribute" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: 'public static Guid ToGuid<T>(this T value) where T : Enum'
    parameters:
    - id: value
      type: '{T}'
      description: The enum value to convert.
    typeParameters:
    - id: T
      description: The type of the enum.
    return:
      type: System.Guid
      description: A unique, deterministic <xref href="System.Guid" data-throw-if-not-resolved="false"></xref> based on the module index and enum serial.
    content.vb: Public Shared Function ToGuid(Of T As [Enum])(value As T) As Guid
  overload: Gadema.Core.Utils.EnumGuidExtensions.ToGuid*
  exceptions:
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: Thrown when the enum type is missing the <xref href="Gadema.Core.Utils.ModuleIndexAttribute" data-throw-if-not-resolved="false"></xref>.
