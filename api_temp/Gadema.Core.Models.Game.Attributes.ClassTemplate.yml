  summary: >-
    Defines a template for a character class (e.g., "Warrior", "Mage") within the game's scaling system.

    This links a class name and description to a specific <xref href="Gadema.Core.Models.Game.Attributes.ClassTemplate.AttributeSet" data-throw-if-not-resolved="false"></xref>,

    establishing the baseline stats and level progression for that archetype.
